name: Probe gvg.report

# Finds the JSON endpoints behind gvg.report pages (single-page app) and saves samples to the "probe" branch, so Claude
# can build syncs for them. Run by hand.
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages to scan, and /api/... endpoints to fetch as they are (space separated; no & in a query)"
        default: "/players /guilds"
      pick:
        description: "Optional: comma-separated paths to keep from each fetched endpoint (report.map_geometry,report.sessions.0.map_id)"
        default: ""
      grep:
        description: "Optional: a regular expression; matches in the scanned scripts are saved with the text around them"
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        env:
          GREP: ${{ github.event.inputs.grep }}
          PICK: ${{ github.event.inputs.pick }}
        run: node tools/gvgreport/probe.mjs out ${{ github.event.inputs.pages || '/players /guilds' }}
      - name: Save to the probe branch
        run: |
          git config --global user.name "gvginfo-bot"
          git config --global user.email "gvginfo-bot@users.noreply.github.com"
          cd out && git init -q -b probe && git add -A && git commit -qm "Probe gvg.report"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
