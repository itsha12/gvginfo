name: Discovery

# Step 3 of the learned causal map (tools/replay_analysis/discover.py): every measured variable tested against every
# learned node on matches the node never saw, one node per machine side by side (free on a public repo), then joined.
# Discoveries are held for Denning's approval (data/model/discovery.json, knowledge/discovery.md); nothing is added to
# the model automatically. Run after a Train batch, so the saved prepared data matches the engine.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Note for this discovery run"
        default: ""

permissions:
  contents: write

concurrency:
  group: replays
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        node: [run_outcome, flag_swing, run_defence, capture_speed, power_play, fight_outcome, split_chance, split_answer, split_effect, collapse, pit_npc_loss]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/train-requirements.txt
      - name: Install the model libraries
        run: nproc && pip install -r .github/workflows/train-requirements.txt
      - name: Set up git
        run: |
          git config --global user.name "gvginfo-bot"
          git config --global user.email "gvginfo-bot@users.noreply.github.com"
          git fetch --depth 1 origin +replays:refs/remotes/origin/replays
      - name: Load saved prepared data
        working-directory: tools/replay_analysis
        run: python3 cache.py sync pull
      - name: Test every variable against the node
        working-directory: tools/replay_analysis
        run: python3 discover.py node ${{ matrix.node }}
      - uses: actions/upload-artifact@v4
        with:
          name: disc-${{ matrix.node }}
          path: data/model/discovery/${{ matrix.node }}.json
          retention-days: 1

  join:
    needs: node
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/train-requirements.txt
      - name: Install the model libraries
        run: pip install -r .github/workflows/train-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: disc-*
          path: data/model/discovery
          merge-multiple: true
      - name: Join the nodes
        working-directory: tools/replay_analysis
        run: python3 discover.py join
      - name: Commit the results
        run: |
          git config --global user.name "gvginfo-bot"
          git config --global user.email "gvginfo-bot@users.noreply.github.com"
          git add -A data/model/discovery data/model/discovery.json data/model/discovery_history.json knowledge/discovery.md
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -qm "Discovery: every variable against every learned node (Discovery workflow)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
      - name: Summary
        if: always()
        run: |
          [ -f knowledge/discovery.md ] && sed -n '1,40p' knowledge/discovery.md >> "$GITHUB_STEP_SUMMARY" || echo "No results." >> "$GITHUB_STEP_SUMMARY"
