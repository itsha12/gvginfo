name: Train batch

# Runs a training batch for the replay-analysis engine on GitHub's machines (4 cores) instead of in a Claude chat:
# optionally picks random matches and fetches their replays, adds every stored replay not yet trained on as the next
# batch, rebuilds the analysis and the held-out models (from the prepared data saved on the "cache" branch), writes
# the learning report, saves the cache back and commits the results to main. Claude then reads
# data/model/reports/latest.md and explains it. Started by hand (Actions tab, or Claude with gh api).
# Split across machines for speed (free on a public repo): "fetch" picks, fetches and adds the batch; four "shard" jobs
# build every match's own prepared data side by side (cache.py shard: analysis, node rows, event-layer records);
# "prepare" merges them, analyses (now cache hits) and warms the held-out models; six "part" jobs then build the
# report's heavy sections side by side (learning.py part ...);
# "finish" joins them, runs values, the TQs and the snapshot (learning.py finish), saves the cache and commits.
# Jobs pass their work on as artifacts: a git patch of the files they changed plus the new cache files.
# Each job may run up to 3 hours (Denning, after batch 9: room for a full rebuild and larger batches).
on:
  workflow_dispatch:
    inputs:
      pick:
        description: "Random matches to pick and fetch first (0 = use replays already stored or requested)"
        default: "0"
      months:
        description: "Pick only from these months, comma-separated (e.g. 2026-10,2026-11; blank = any month)"
        default: ""
      add_batch:
        description: "Add the stored replays not yet trained on as a new batch (no = just rebuild the report)"
        type: choice
        options: ["yes", "no"]
        default: "yes"
      note:
        description: "Note for the batch (e.g. why these matches were chosen)"
        default: ""
      rebuild_forensics:
        description: "Rebuild the forensics benchmarks from every stored replay first (after a forensics change; slower)"
        type: choice
        options: ["no", "yes"]
        default: "no"
      runner:
        description: "Machine type (ubuntu-latest = the usual x64; ubuntu-24.04-arm = arm64, free for public repos)"
        type: choice
        options: ["ubuntu-latest", "ubuntu-24.04-arm"]
        default: "ubuntu-latest"

permissions:
  contents: write

concurrency:
  group: replays
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  fetch:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/train-requirements.txt
      - name: Install the model libraries (same versions as the chat workspace)
        run: nproc && pip install -r .github/workflows/train-requirements.txt
      - name: Set up git
        run: |
          git config --global user.name "gvginfo-bot"
          git config --global user.email "gvginfo-bot@users.noreply.github.com"
          git fetch --depth 1 origin +replays:refs/remotes/origin/replays || true
      - name: Pick random matches
        if: ${{ github.event.inputs.pick != '0' && github.event.inputs.pick != '' }}
        working-directory: tools/replay_analysis
        env:
          MONTHS: ${{ github.event.inputs.months }}
        run: python3 batch.py pick ${{ github.event.inputs.pick }} ${MONTHS:+--months "$MONTHS"}
      - name: Fetch requested replays
        run: |
          git clone --depth 1 --branch replays "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store
          rm -rf store/probe
          MAX_FETCH=500 DELAY_MS=4000 node tools/gvgreport/replays.mjs store
          cd store
          git add -A
          if ! git diff --cached --quiet; then git commit -qm "Add replays (training batch)" && git push origin replays; fi
          cd .. && rm -rf store
          git fetch --depth 1 origin +replays:refs/remotes/origin/replays
      - name: Add the batch
        if: ${{ github.event.inputs.add_batch == 'yes' }}
        working-directory: tools/replay_analysis
        env:
          NOTE: ${{ github.event.inputs.note }}
        run: |
          python3 batch.py add
          python3 - <<'PY'
          import json, os
          p = "../../data/model/batches.json"; b = json.load(open(p))
          if os.environ.get("NOTE"): b["batches"][-1].setdefault("note", os.environ["NOTE"])
          json.dump(b, open(p, "w"), indent=1)
          PY
      - name: Pack the batch
        run: |
          mkdir -p /tmp/fetch
          git add -A && git diff --cached --binary > /tmp/fetch/fetch.patch
          ls -la /tmp/fetch
      - uses: actions/upload-artifact@v4
        with:
          name: fetch
          path: /tmp/fetch
          retention-days: 1

  # the speed-up (Denning's order, step 3): every match's own prepared data (analysis, node rows, event-layer records)
  # built on four machines side by side; prepare then merges their cache files and finds everything built
  shard:
    needs: fetch
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        k: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/train-requirements.txt
      - name: Install the model libraries
        run: nproc && pip install -r .github/workflows/train-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: fetch
          path: /tmp/fetch
      - name: Restore the batch
        run: |
          git config --global user.name "gvginfo-bot"
          git config --global user.email "gvginfo-bot@users.noreply.github.com"
          git fetch --depth 1 origin +replays:refs/remotes/origin/replays
          [ -s /tmp/fetch/fetch.patch ] && git apply --binary /tmp/fetch/fetch.patch || true
      - name: Load saved prepared data
        working-directory: tools/replay_analysis
        run: python3 cache.py sync pull
      - name: Build this shard's matches
        working-directory: tools/replay_analysis
        run: |
          touch /tmp/marker && sleep 1
          python3 cache.py shard ${{ matrix.k }} 4
      - name: Pack this shard
        run: |
          mkdir -p /tmp/shard
          cd / && find "${HOME#/}/.cache/gvginfo" -type f -newer /tmp/marker > /tmp/newfiles.txt
          wc -l /tmp/newfiles.txt
          tar -czf /tmp/shard/shard-${{ matrix.k }}.tgz -C / -T /tmp/newfiles.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.k }}
          path: /tmp/shard
          retention-days: 1
          compression-level: 0

  prepare:
    needs: shard
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/train-requirements.txt
      - name: Install the model libraries (same versions as the chat workspace)
        run: nproc && pip install -r .github/workflows/train-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: fetch
          path: /tmp/fetch
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: /tmp/shards
          merge-multiple: true
      - name: Restore the batch
        run: |
          git config --global user.name "gvginfo-bot"
          git config --global user.email "gvginfo-bot@users.noreply.github.com"
          git fetch --depth 1 origin +replays:refs/remotes/origin/replays
          [ -s /tmp/fetch/fetch.patch ] && git apply --binary /tmp/fetch/fetch.patch || true
      - name: Load saved prepared data and the shards
        working-directory: tools/replay_analysis
        run: |
          python3 cache.py sync pull
          for t in /tmp/shards/*.tgz; do tar -xzf "$t" -C /; done
      - name: Rebuild the forensics benchmarks
        if: ${{ github.event.inputs.rebuild_forensics == 'yes' }}
        working-directory: tools/replay_analysis
        run: python3 forensics.py bench
      - name: Analyse every match
        working-directory: tools/replay_analysis
        run: |
          python3 analyze.py --all --out /tmp/ga > /dev/null
          python3 library.py build > /dev/null
      - name: Held-out models and fight-state predictions
        working-directory: tools/replay_analysis
        run: |
          python3 cache.py warm
          python3 -c "import learning as L, model as M; L.fightstate_extra([m for b in M.batches() for m in b['matches']])"
      - name: Pack the prepared state
        run: |
          mkdir -p /tmp/state
          git add -A && git diff --cached --binary > /tmp/state/prep.patch
          tar -czf /tmp/state/prep.tgz -C / "${HOME#/}/.cache/gvginfo" tmp/ga tmp/gl
          ls -la /tmp/state
      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: /tmp/state
          retention-days: 1
          compression-level: 0

  part:
    needs: prepare
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        include:
          - id: main
            arg: main
          - id: learned
            arg: learned
          - id: cands
            arg: cands
          - id: nodes-deaths
            arg: "nodes:deaths"
          - id: nodes-b
            arg: "nodes:lord_kill,npc_loss"
          - id: nodes-c
            arg: "nodes:kill_conversion,lord_damage,flag_answer"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/train-requirements.txt
      - name: Install the model libraries
        run: nproc && pip install -r .github/workflows/train-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: /tmp/state
      - name: Restore the prepared state
        run: |
          git config --global user.name "gvginfo-bot"
          git config --global user.email "gvginfo-bot@users.noreply.github.com"
          git fetch --depth 1 origin +replays:refs/remotes/origin/replays
          [ -s /tmp/state/prep.patch ] && git apply --binary /tmp/state/prep.patch
          tar -xzf /tmp/state/prep.tgz -C /
          git add -A && git commit -qm "prepared state (local only)" --allow-empty
          touch /tmp/marker && sleep 1
      - name: Build this part of the report
        working-directory: tools/replay_analysis
        run: python3 learning.py part "${{ matrix.arg }}" --out /tmp/out
      - name: Pack this part
        run: |
          git add -A && git diff --cached --binary HEAD > /tmp/out/${{ matrix.id }}.patch
          cd / && find "${HOME#/}/.cache/gvginfo" -type f -newer /tmp/marker > /tmp/newfiles.txt
          tar -czf /tmp/out/${{ matrix.id }}-cache.tgz -C / -T /tmp/newfiles.txt
          ls -la /tmp/out
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.id }}
          path: /tmp/out
          retention-days: 1
          compression-level: 0

  finish:
    needs: part
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/train-requirements.txt
      - name: Install the model libraries
        run: nproc && pip install -r .github/workflows/train-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: /tmp/state
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: /tmp/parts
          merge-multiple: true
      - name: Join the prepared state and the parts
        run: |
          git config --global user.name "gvginfo-bot"
          git config --global user.email "gvginfo-bot@users.noreply.github.com"
          git fetch --depth 1 origin +replays:refs/remotes/origin/replays
          [ -s /tmp/state/prep.patch ] && git apply --binary /tmp/state/prep.patch
          tar -xzf /tmp/state/prep.tgz -C /
          for p in /tmp/parts/*.patch; do [ -s "$p" ] && git apply --binary "$p"; done
          for t in /tmp/parts/*-cache.tgz; do tar -xzf "$t" -C /; done
          ls -la /tmp/parts
      - name: Learning report (values, TQs, snapshot; join)
        working-directory: tools/replay_analysis
        run: |
          python3 learning.py finish /tmp/parts
          python3 status.py sync > /dev/null
      - name: Save prepared data
        working-directory: tools/replay_analysis
        run: python3 cache.py sync push
      - name: Commit the results
        run: |
          git add -A data/model data/benchmarks knowledge replays/requests.txt
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -qm "Training batch: learning report (Train batch workflow)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
      - name: Summary
        if: always()
        run: |
          echo "## Learning report" >> "$GITHUB_STEP_SUMMARY"
          [ -f data/model/reports/latest.md ] && sed -n '1,30p' data/model/reports/latest.md >> "$GITHUB_STEP_SUMMARY" || echo "No report." >> "$GITHUB_STEP_SUMMARY"
          [ -f data/model/reports/timings.json ] && { echo '```' ; cat data/model/reports/timings.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
